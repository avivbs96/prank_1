<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>באמת?</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #fff0f5;
    }
    .box {
      text-align: center;
    }
    button {
      font-size: 18px;
      padding: 12px 30px;
      margin: 10px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
    }
    .yes {
      background: #4CAF50;
      color: white;
    }
    .no {
      background: #f44336;
      color: white;
    }
    .sad {
      font-size: 40px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>באמת?</h1>
  <a href="step2.html"><button class="yes">כן</button></a>
  <button class="no" onclick="showSad()">לא</button>
  <div id="sad" class="sad"></div>
</div>

<script>
  function showSad() {
    document.getElementById("sad").textContent = "😢";
  }
</script>

</body>
</html>
