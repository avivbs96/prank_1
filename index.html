<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>שאלה קטנה ❤️</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e0, #ffeef3);
      font-family: Arial, sans-serif;
      direction: rtl;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
    }
    button {
      font-size: 18px;
      padding: 12px 30px;
      margin: 10px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
    }
    .yes { background: #4CAF50; color: white; }
    .no { background: #f44336; color: white; }
    .sad { font-size: 40px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="box">
  <h1>תעני לי בכנות<br>את אוהבת אותי?</h1>
  <a href="step1.html"><button class="yes">כן</button></a>
  <button class="no" onclick="showSad()">לא</button>
  <div id="sad" class="sad"></div>
</div>

<script>
  function showSad() {
    document.getElementById("sad").textContent = "😢";
  }
</script>

</body>
</html>
